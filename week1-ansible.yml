
**week1-ansible.yml**
```yaml
---
- name: Week 1 Ansible Tasks
  hosts: app_servers
  become: yes

  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Run Nginx container
      docker_container:
        name: nginx_app
        image: nginx:latest
        state: started
        ports:
          - "80:80"

    - name: Remove Nginx container
      docker_container:
        name: nginx_app
        state: absent

    - name: Copy index.html into container
      docker_container_copy:
        container: nginx_app
        src: ./index.html
        dest: /usr/share/nginx/html/index.html

    - name: Check container logs
      command: docker logs nginx_app
      register: logs

    - debug:
        var: logs.stdout
